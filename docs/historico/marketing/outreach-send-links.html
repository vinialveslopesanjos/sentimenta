    function enc(value) {

    function render() {

      root.innerHTML = prospects.map((p, index) => {
        const mailto = p.email ? `mailto:${p.email}?subject=${enc(p.subject)}&body=${enc(p.message)}` : "";
        const waText = `Oi, equipe ${p.name}. Vi o trabalho de voces e queria oferecer um diagnostico gratuito dos comentarios de 1 perfil/post publico com o Sentimenta. Posso mandar mais detalhes por aqui?`;
        const wa = p.phone ? `https://wa.me/${p.phone}?text=${enc(waText)}` : "";
        return `
          <section class="card">
            <h2>${index + 1}. ${p.name}</h2>
            <div class="meta">${p.email || "Sem email"} ${p.phone ? " | WhatsApp: +" + p.phone : ""}</div>
            <div class="actions">
              ${mailto ? `<a href="${mailto}">Enviar email</a>` : ""}
