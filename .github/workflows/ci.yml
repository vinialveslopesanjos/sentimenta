name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/security-fixes
      - codex/**
      - fix/**

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Type check
        run: npm run type-check

      - name: Build web
        run: npm run build:web

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Build mobile
        run: npm run build --workspace=@sentimenta/mobile --if-present

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  infra:
    name: Infra config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose config
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          SECRET_KEY: ci-secret-key
          TOKEN_ENCRYPTION_KEY: ci-token-encryption-key
        run: |
          cp .env.prod.example .env
          docker compose -f compose.prod.yml config

  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs:
      - web
      - backend
      - infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          npx playwright install chromium --with-deps

      - name: Seed E2E database
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./e2e.db
          SECRET_KEY: test-secret-key-for-e2e
          TOKEN_ENCRYPTION_KEY: test-token-encryption-key-for-e2e
          DEBUG: "true"
        run: python ../scripts/e2e_seed.py

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./e2e.db
          SECRET_KEY: test-secret-key-for-e2e
          TOKEN_ENCRYPTION_KEY: test-token-encryption-key-for-e2e
          DEBUG: "true"
          REDIS_URL: ""
          CELERY_BROKER_URL: ""
          CELERY_RESULT_BACKEND: ""
          APP_URL: http://localhost:3000
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e-results-api.log 2>&1 &

      - name: Start frontend
        env:
          API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: |
          npm run build:web
          npm run start --workspace=frontend -- --hostname 127.0.0.1 --port 3000 > e2e-results-web.log 2>&1 &

      - name: Wait for services
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become healthy"
          cat e2e-results-api.log || true
          cat e2e-results-web.log || true
          exit 1

      - name: Run Playwright smoke tests
        env:
          BASE_URL: http://127.0.0.1:3000
          API_URL: http://127.0.0.1:8000
          E2E_EMAIL: e2e-seed@example.com
          E2E_PASSWORD: SeedPassword123!
        run: npm run test:e2e:smoke

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-results
          path: |
            e2e-results/
            e2e-results-api.log
            e2e-results-web.log
          retention-days: 14
