name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Type check
        run: npm run type-check

      - name: Build web
        run: npm run build:web

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Build mobile
        run: npm run build --workspace=@sentimenta/mobile --if-present

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Run tests
        run: python -m pytest

      - name: Python dependency audit
        # PYSEC-2026-1325 (ecdsa, transitiva de python-jose): sem fix upstream —
        # o projeto ecdsa declara side-channel fora de escopo. Nosso JWT usa
        # HS256 (config.ALGORITHM); os caminhos ES* do ecdsa nunca são exercidos.
        # Remover o ignore ao migrar python-jose -> PyJWT (issue de follow-up).
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

  infra:
    name: Infra config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose config
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          SECRET_KEY: ci-secret-key
          TOKEN_ENCRYPTION_KEY: ci-token-encryption-key
        run: |
          cp .env.prod.example .env
          docker compose -f compose.prod.yml config

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --no-git --verbose

      - name: Filesystem vulnerability and misconfiguration scan
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed /repo

      - name: Generate SBOM
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs --format cyclonedx --output /repo/trivy-sbom.cdx.json /repo

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sbom
          path: trivy-sbom.cdx.json
          retention-days: 14

  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs:
      - web
      - backend
      - infra
      - security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          npx playwright install chromium --with-deps

      - name: Build shared packages
        run: npm run build:packages

      - name: Seed E2E database
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./e2e.db
          SECRET_KEY: test-secret-key-for-e2e
          TOKEN_ENCRYPTION_KEY: test-token-encryption-key-for-e2e
          DEBUG: "true"
        run: python ../scripts/e2e_seed.py

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./e2e.db
          SECRET_KEY: test-secret-key-for-e2e
          TOKEN_ENCRYPTION_KEY: test-token-encryption-key-for-e2e
          DEBUG: "true"
          REDIS_URL: ""
          CELERY_BROKER_URL: ""
          CELERY_RESULT_BACKEND: ""
          APP_URL: http://localhost:3000
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e-results-api.log 2>&1 &

      - name: Start frontend
        env:
          API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: |
          npm run build:web
          npm run start --workspace=frontend -- --hostname 127.0.0.1 --port 3000 > e2e-results-web.log 2>&1 &

      - name: Wait for services
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become healthy"
          cat e2e-results-api.log || true
          cat e2e-results-web.log || true
          exit 1

      - name: Run Playwright smoke tests
        env:
          BASE_URL: http://127.0.0.1:3000
          API_URL: http://127.0.0.1:8000
          E2E_EMAIL: e2e-seed@example.com
          E2E_PASSWORD: SeedPassword123!
        run: npm run test:e2e:smoke

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-results
          path: |
            e2e-results/
            e2e-results-api.log
            e2e-results-web.log
          retention-days: 14

  product-trust-gate:
    name: Product trust gate
    runs-on: ubuntu-latest
    needs:
      - web
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          npx playwright install chromium --with-deps

      - name: Build shared packages
        run: npm run build:packages

      - name: Seed isolated product QA database
        # Freshness and rolling 24-hour ops checks must be evaluated relative
        # to the gate execution time. Fixed anchors remain available for exact
        # fixture reproduction and the deterministic backend seed tests.
        run: python scripts/dev/qa_seed.py --anchor now > product-trust-seed.log

      - name: Start isolated read-only QA backend
        run: python scripts/dev/qa_server.py --port 8000 > product-trust-api.log 2>&1 &

      - name: Start frontend
        env:
          API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: |
          npm run build:web
          npm run start --workspace=frontend -- --hostname 127.0.0.1 --port 3000 > product-trust-web.log 2>&1 &

      - name: Wait for isolated services
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Product trust services did not become healthy"
          cat product-trust-api.log || true
          cat product-trust-web.log || true
          exit 1

      - name: Run deterministic product trust gate
        env:
          BASE_URL: http://127.0.0.1:3000
          API_URL: http://127.0.0.1:8000
        run: npm run test:e2e:trust

      - name: Upload product trust artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-trust-gate-results
          path: |
            e2e-results/
            artifacts/product-audit-2026-08-26/evidence/4.2/*.png
            product-trust-seed.log
            product-trust-api.log
            product-trust-web.log
          retention-days: 14
